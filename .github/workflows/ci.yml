name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      ios:
        description: "iOS 빌드(서명 없이 컴파일 확인)도 실행"
        type: boolean
        default: false

jobs:
  server:
    name: 서버 빌드·통합 시험
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eumtalk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/eumtalk_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  admin:
    name: 관리자 웹 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  android:
    name: Android 테스트 APK·Play용 AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: pip install pillow
      - run: python3 tool/bootstrap.py
      - run: flutter pub get
      - run: flutter analyze
      # 저장소 Settings → Variables 에 API_BASE_URL(예: https://eumtalk-api.onrender.com)을 넣으면 그 서버로 붙는 APK가 만들어진다.
      # 비워 두어도 앱 첫 화면에서 앱 이름을 길게 눌러 서버 주소를 바꿀 수 있다.
      # Firebase 값(Settings → Variables)을 넣으면 푸시 수신이 켜진 APK가 만들어진다. 비워 두면 푸시 없이 동작한다.
      - name: 빌드 설정값
        run: |
          echo "DEFINES=--dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://eumtalk-api.onrender.com' }} --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }} --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }} --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} --dart-define=FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }} --dart-define=FIREBASE_IOS_APP_ID=${{ vars.FIREBASE_IOS_APP_ID }}" >> "$GITHUB_ENV"
      - run: flutter build apk --release $DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: eumtalk-test-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      # Play 제출용 AAB: 저장소 Secrets 에 업로드 키(ANDROID_KEYSTORE_BASE64 등)가 있으면 그 키로 서명한다.
      # 없으면 서명 경로 점검용 임시 키로 서명한다(이 AAB는 Play에 올릴 수 없다).
      - name: 업로드 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
            echo "AAB_NAME=eumtalk-play-aab" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/temp.jks" -storepass temppass -keypass temppass -alias temp -keyalg RSA -keysize 2048 -validity 1 -dname "CN=eumtalk-ci-temp" -noprompt
            printf "storeFile=%s\nstorePassword=temppass\nkeyAlias=temp\nkeyPassword=temppass\n" "$RUNNER_TEMP/temp.jks" > android/key.properties
            echo "AAB_NAME=eumtalk-aab-temp-key-not-for-play" >> "$GITHUB_ENV"
          fi
      # 스토어 제출용은 서버 주소 변경 기능을 끈다.
      - run: flutter build appbundle --release $DEFINES --dart-define=ALLOW_SERVER_OVERRIDE=false
      - name: AAB 서명 확인
        run: |
          jarsigner -verify -certs build/app/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/verify.txt" 2>&1 || true
          grep -E "jar verified|unsigned" "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.AAB_NAME }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
      # main 빌드는 저장소 릴리스(비공개)에도 올린다. 업로드 키 서명은 릴리스 담당자가 받아서 한다.
      - name: 저장소 릴리스에 빌드 올리기
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          TAG="android-${VERSION}-run${{ github.run_number }}"
          cp build/app/outputs/bundle/release/app-release.aab "eumtalk-${VERSION}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "eumtalk-${VERSION}-test.apk"
          gh release create "$TAG" "eumtalk-${VERSION}.aab" "eumtalk-${VERSION}-test.apk" --prerelease --title "Android ${VERSION} (실행 ${{ github.run_number }})" --notes "서버: ${{ vars.API_BASE_URL || 'https://eumtalk-api.onrender.com' }} / AAB 서명: ${{ env.AAB_NAME }}"

  ios:
    name: iOS 컴파일 확인(서명 없음)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.ios }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: pip3 install pillow --break-system-packages || true
      - run: python3 tool/bootstrap.py
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign

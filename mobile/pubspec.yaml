name: eumtalk
description: "이음톡 — 내 주변 사람과 관심사로 이어지는 동네 대화"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Flutter 3.47부터 Material 위젯은 flutter/material.dart 대신 이 패키지에서 제공한다.
  material_ui: ^1.5.0
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.3.0
  geolocator: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand.json
